[project]
name = "forum"
version = "0.0.1"
description = "Deliberative-polling simulation against demographically grounded synthetic personas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vatsal Patel" }]
dependencies = [
  "langgraph>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "google-generativeai>=0.8.0",
  "anthropic>=0.69.0",
  "duckdb>=1.0.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "pyright>=1.1.380",
]

[project.scripts]
forum = "forum.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forum", "personas", "backtest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
