# Framing presented to FORUM agents. MUST NOT name the year of the vote
# nor reveal the outcome (see docs/methodology.md §4).
framing: >-
  Washington State is considering a policy that would legalize the possession
  of small amounts of marijuana for adults aged 21 and over, and would create
  a state-licensed system to produce, distribute, and sell marijuana, with
  sales taxed and the revenue directed to the state. Should the policy be
  enacted?

briefing: >-
  The proposal would remove state criminal penalties for adults 21 and older
  possessing up to one ounce of marijuana, and would task the state liquor
  regulator with licensing growers, processors, and retailers. Marijuana
  sales would carry a substantial excise tax, with revenue dedicated to
  public health, substance-abuse prevention, and the state general fund. The
  measure sets a per-se limit for marijuana-impaired driving. Marijuana would
  remain illegal under federal law regardless of state action. Supporters
  argue legal regulation redirects law-enforcement resources, undercuts the
  illicit market, and raises public revenue; opponents argue it conflicts
  with federal law, may increase youth access and impaired driving, and that
  the driving limit is not science-based.

briefing_sources:
  - "Washington State Voters' Pamphlet, Initiative Measure No. 502 (full text and explanatory statement)"
  - "Washington Office of Financial Management, I-502 fiscal impact statement"
  - "American Civil Liberties Union of Washington, statement in support"
  - "Association of Washington Cities and law-enforcement association statements"

pro_arguments:
  - "Regulating and taxing marijuana redirects police and court resources away from low-level possession."
  - "A licensed, taxed market undercuts the illicit trade and generates dedicated public-health revenue."
  - "Adults should not face criminal penalties for personal marijuana use."

con_arguments:
  - "Marijuana remains illegal under federal law, creating legal conflict and uncertainty for the state."
  - "Legalization may increase youth access and normalize use."
  - "The fixed blood-THC limit for impaired driving is not a reliable measure of impairment."

n_rounds: 5
